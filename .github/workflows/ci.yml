name: CI

# `pull_request`, never `pull_request_target`: a PR build runs contributor code
# (install + next build), so it gets the unprivileged, secretless token.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; tags are mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # No `cache: pnpm`: its post-job save is a cache-poisoning vector.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Fails instead of resolving a graph pnpm-lock.yaml doesn't record.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Audit production dependencies (critical)
        run: pnpm audit --prod --audit-level=critical
