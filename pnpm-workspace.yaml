packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  sharp: true

# Quarantine newly published versions (24h) — a poisoned release is usually pulled within hours.
minimumReleaseAge: 1440

# Refuse an immature version instead of silently excluding it.
minimumReleaseAgeStrict: true

# Block git/tarball transitive dependencies.
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - '@modelcontextprotocol/sdk@1.31.0 || 1.32.0'
